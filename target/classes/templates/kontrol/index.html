<!DOCTYPE html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kontrol Dokter | OMIBAT</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/navbar :: nav}"></div><main class="container"><div class="page-heading"><div><div class="eyebrow">AGENDA KESEHATAN</div><h1>Kontrol Dokter</h1><p>Simpan jadwal kunjungan dan catatan kontrol.</p></div><a class="btn primary" th:href="@{/kontrol/tambah}">＋ Tambah Kontrol</a></div>
<div class="panel table-panel"><div th:if="${#lists.isEmpty(daftarKontrol)}" class="empty">Belum ada jadwal kontrol dokter.</div>
<table th:unless="${#lists.isEmpty(daftarKontrol)}"><thead><tr><th>Dokter</th><th>Tanggal</th><th>Jam</th><th>Lokasi</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody>
<tr th:each="item : ${daftarKontrol}"><td th:text="${item.namaDokter}"></td><td th:text="${item.tanggalKontrol}"></td><td th:text="${item.jamKontrol}"></td><td th:text="${item.lokasi}"></td><td th:text="${item.catatan}"></td><td class="actions"><a class="text-link" th:href="@{/kontrol/edit/{id}(id=${item.id})}">Edit</a><form th:action="@{/kontrol/hapus/{id}(id=${item.id})}" method="post" onsubmit="return confirm('Hapus jadwal kontrol ini?')"><button class="delete-link" type="submit">Hapus</button></form></td></tr>
</tbody></table></div></main></body></html>
