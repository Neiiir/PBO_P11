<!DOCTYPE html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jadwal Minum | OMIBAT</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/navbar :: nav}"></div><main class="container"><div class="page-heading"><div><div class="eyebrow">PENGELOLAAN JADWAL</div><h1>Jadwal Minum Obat</h1><p>Atur waktu dan aturan minum setiap obat.</p></div><a class="btn primary" th:href="@{/jadwal/tambah}">＋ Tambah Jadwal</a></div>
<div class="panel table-panel"><div th:if="${#lists.isEmpty(daftarJadwal)}" class="empty">Belum ada jadwal. Pastikan data obat sudah dibuat terlebih dahulu.</div>
<table th:unless="${#lists.isEmpty(daftarJadwal)}"><thead><tr><th>Nama Obat</th><th>Waktu</th><th>Frekuensi</th><th>Aturan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
<tr th:each="item : ${daftarJadwal}"><td th:text="${item.obat.namaObat}"></td><td th:text="${item.waktuMinum}"></td><td th:text="${item.frekuensi}"></td><td th:text="${item.aturanWaktu}"></td><td><span class="status" th:text="${item.aktif ? 'Aktif' : 'Nonaktif'}"></span></td><td class="actions"><a class="text-link" th:href="@{/jadwal/edit/{id}(id=${item.id})}">Edit</a><form th:action="@{/jadwal/hapus/{id}(id=${item.id})}" method="post" onsubmit="return confirm('Hapus jadwal ini?')"><button class="delete-link" type="submit">Hapus</button></form></td></tr>
</tbody></table></div></main></body></html>
